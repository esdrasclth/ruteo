# Todos los puertos se publican SOLO en 127.0.0.1 y nunca en 0.0.0.0.
#
# No es paranoia de más: Docker escribe sus reglas en la cadena `DOCKER` de
# iptables, que se evalúa ANTES que las de UFW. Un `ufw deny 6379` no cierra un
# puerto publicado por Compose —queda abierto a internet aunque el firewall
# diga lo contrario—. La única forma fiable de no exponerlo es no publicarlo
# fuera del loopback.
#
# Si algún día el backend corre en otra máquina, la vía es una red privada o un
# túnel, NO quitar el `127.0.0.1:` de aquí.
services:
  db:
    image: postgres:16-alpine
    container_name: ruteo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ruteo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruteo}
      POSTGRES_DB: ${POSTGRES_DB:-ruteo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ruteo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruteo} -d ${POSTGRES_DB:-ruteo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # `--requirepass` va en el comando y no en un archivo de configuración para
  # que la contraseña venga del entorno y no acabe versionada. En local, si
  # `REDIS_PASSWORD` está vacía, Redis arranca sin contraseña y todo sigue
  # funcionando igual; en el VPS es obligatoria.
  redis:
    image: redis:7-alpine
    container_name: ruteo-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
             then exec redis-server --requirepass "$$REDIS_PASSWORD";
             else exec redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ruteo_redisdata:/data
    healthcheck:
      # El healthcheck también necesita la contraseña: sin ella `redis-cli ping`
      # responde NOAUTH y el contenedor se quedaría eternamente "unhealthy".
      #
      # El `if` va DENTRO del comando (con `$$`, que Compose entrega como `$`
      # literal) en vez de resolverse con `${VAR:+...}`: esa forma la expande
      # Compose contra el entorno del HOST, no del contenedor, y bastaba con no
      # tener la variable exportada en la shell para generar un healthcheck que
      # no corresponde a cómo arrancó Redis.
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ];
          then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping;
          else redis-cli ping; fi | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 5

  # Motor de rutas por carretera (OpenStreetMap). Sirve la geometría real de las
  # calles entre las paradas de un reparto, en vez de líneas rectas.
  #
  # El volumen `ruteo_osrmdata` debe traer los artefactos ya preprocesados; un
  # clon nuevo del repo no los tiene y hay que generarlos una vez con
  # `scripts/osrm-prepare.sh` (tarda ~1 min para Honduras y ocupa ~420 MB).
  # Sin ellos el contenedor arranca y muere en bucle: es esperado, no un fallo
  # de configuración.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: ruteo-osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/honduras.osrm
    ports:
      - "127.0.0.1:${OSRM_PORT:-5100}:5000"
    volumes:
      - ruteo_osrmdata:/data

volumes:
  ruteo_pgdata:
  ruteo_redisdata:
  # `name` explícito: sin esto Compose lo bautiza `ruteo_ruteo_osrmdata` y el
  # script de preparación (que crea `ruteo_osrmdata` a secas) llenaría un volumen
  # distinto del que monta el contenedor. Los dos de arriba NO llevan `name` a
  # propósito: cambiárselo dejaría huérfanos los datos de Postgres y Redis.
  ruteo_osrmdata:
    name: ruteo_osrmdata
